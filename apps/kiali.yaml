# Kiali, Istio's console: the kiali-server chart with this repo's values.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiali
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kiali.org/helm-charts
      chart: kiali-server
      targetRevision: 2.35.0
      helm:
        releaseName: kiali
        valueFiles:
          - $values/istio/kiali-values.yaml
    - repoURL: https://github.com/mrfelek/floci-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
