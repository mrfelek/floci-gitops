# Prometheus for Freelens's charts: the prometheus-community chart with this repo's values.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: 29.47.2
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/monitoring/prometheus-values.yaml
    - repoURL: https://github.com/mrfelek/floci-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
